# THIS FILE IS MANAGED BY nine-manage-vhosts

server {

  listen    *:80;

  server_name test.zeugnio.ch test.zeugnio.ch.advisori01.nine.ch;

  root /home/www-zeugnio/test.zeugnio.ch;

  error_log /home/www-zeugnio/logs/test.zeugnio.ch.error.log;
  access_log /home/www-zeugnio/logs/test.zeugnio.ch.access.log combined;

  # Disable hidden files (except well-known)
  location ~ /\.(?!well-known).* {
    deny all;
  }
  # Directives_plain
  return 301 https://$host$request_uri;
}
server {

  listen    *:443 ssl;

  server_name test.zeugnio.ch test.zeugnio.ch.advisori01.nine.ch;

  ssl_certificate /etc/ssl/letsencrypt/certs/test.zeugnio.ch/fullchain.pem;
  ssl_certificate_key /etc/ssl/letsencrypt/private/test.zeugnio.ch/priv.pem;


  root /home/www-zeugnio/test.zeugnio.ch;

  error_log /home/www-zeugnio/logs/test.zeugnio.ch.error.log;
  access_log /home/www-zeugnio/logs/test.zeugnio.ch.access.log combined;

  # Deny access to hidden files (except .well-known for Let's Encrypt)
  location ~ /\.(?!well-known).* {
    deny all;
  }
# Directives_ssl
  location /.well-known/acme-challenge/ {
  }

  location / {
  proxy_pass http://localhost:3010/;

  proxy_http_version 1.1;
  proxy_set_header   Upgrade $http_upgrade;
  proxy_set_header   Connection $connection_upgrade;
  proxy_set_header   X-Real-IP $remote_addr;
  proxy_set_header   Host $http_host;
  proxy_set_header   X-Forwarded-Proto $scheme;
  proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;

  proxy_connect_timeout 300;
  proxy_send_timeout 300;
  proxy_read_timeout 300;
  }
}
