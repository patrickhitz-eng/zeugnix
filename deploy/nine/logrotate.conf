# Log-Rotation fuer PM2 (Vorlage aus der nine-Dokumentation). Inhalt an ~/.logrotate.conf anhaengen:
#   cat deploy/nine/logrotate.conf >> ~/.logrotate.conf
#
# Wichtig fuer zeugnio: in den Logs stehen keine Personendaten (lib/log/redact.ts sorgt dafuer,
# PostgREST laeuft mit log-level=error). Trotzdem gilt die Aufbewahrung von 14 Tagen als Obergrenze -
# Logs sind Bearbeitung im Sinne des DSG und gehoeren ins Verzeichnis der Bearbeitungstaetigkeiten.
~/.pm2/logs/*.log {
  daily
  rotate 14
  notifempty
  compress
  copytruncate
  compresscmd /usr/bin/zstdmt
  compressoptions -18 -T0 --rm -qq
  compressext .zst
  uncompresscmd /usr/bin/unzstd
}
